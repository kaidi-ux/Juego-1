
name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
    - uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: "8.9"
    - name: Crear proyecto
      run: |
        mkdir -p .
        cat > settings.gradle <<'EOF'
        pluginManagement {
        repositories { google(); mavenCentral(); gradlePluginPortal() }
        }
        dependencyResolutionManagement {
        repositories { google(); mavenCentral() }
        }
        rootProject.name = "MiSims"
        include ':app'
        EOF
        mkdir -p .
        cat > build.gradle <<'EOF'
        plugins {
        id 'com.android.application' version '8.5.2' apply false
        id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
        }
        EOF
        mkdir -p app
        cat > app/build.gradle <<'EOF'
        plugins {
        id 'com.android.application'
        id 'org.jetbrains.kotlin.android'
        }
        android {
        namespace 'com.mijuego.sims'
        compileSdk 34
        defaultConfig {
        applicationId 'com.mijuego.sims'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
        }
        compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        }
        kotlinOptions { jvmTarget = '17' }
        }
        EOF
        mkdir -p app/src/main
        cat > app/src/main/AndroidManifest.xml <<'EOF'
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
        <application
        android:label="Mi Sims"
        android:allowBackup="true"
        android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
        <activity
        android:name=".MainActivity"
        android:exported="true"
        android:screenOrientation="portrait">
        <intent-filter>
        <action android:name="android.intent.action.MAIN" />
        <category android:name="android.intent.category.LAUNCHER" />
        </intent-filter>
        </activity>
        </application>
        </manifest>
        EOF
        mkdir -p app/src/main/java/com/mijuego/sims
        cat > app/src/main/java/com/mijuego/sims/MainActivity.kt <<'EOF'
        package com.mijuego.sims
        import android.app.Activity
        import android.content.Context
        import android.graphics.Canvas
        import android.graphics.Color
        import android.graphics.Paint
        import android.graphics.RectF
        import android.os.Bundle
        import android.view.MotionEvent
        import android.view.View
        import android.view.WindowManager
        import kotlin.math.abs
        import kotlin.math.max
        import kotlin.math.min
        import kotlin.math.sign
        import kotlin.random.Random
        class MainActivity : Activity() {
        private lateinit var g: GameView
        override fun onCreate(b: Bundle?) {
        super.onCreate(b)
        window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
        g = GameView(this)
        setContentView(g)
        }
        override fun onPause() { super.onPause(); g.save() }
        }
        class D(val n: String, val w: Int, val h: Int, val price: Int, val fx: FloatArray, val money: Float, val dur: Int, val stop: Int)
        class F(val t: Int, val x: Int, val y: Int)
        class P(var x: Float, var y: Float, val s: String, var life: Float)
        val DEFS = listOf(
        D("Cama", 1, 2, 150, floatArrayOf(0f, .3f, 0f, 0f, 0f), 0f, 480, 1),
        D("Nevera", 1, 1, 200, floatArrayOf(1.6f, 0f, 0f, 0f, 0f), 0f, 60, 0),
        D("Ducha", 1, 1, 180, floatArrayOf(0f, 0f, 2.5f, 0f, 0f), 0f, 40, 2),
        D("Sofá", 2, 1, 120, floatArrayOf(0f, .08f, 0f, .4f, 0f), 0f, 120, -1),
        D("TV", 1, 1, 150, floatArrayOf(0f, 0f, 0f, .7f, 0f), 0f, 120, 3),
        D("Compu", 1, 1, 250, floatArrayOf(0f, 0f, 0f, .3f, .35f), .3f, 120, -1),
        D("Planta", 1, 1, 25, floatArrayOf(0f, 0f, 0f, .5f, 0f), 0f, 10, -1)
        )
        class GameView(c: Context) : View(c) {
        private val p = Paint()
        private val tp = Paint(Paint.ANTI_ALIAS_FLAG)
        private val prefs = c.getSharedPreferences("sims", Context.MODE_PRIVATE)
        private val NAMES = arrayOf("Alex", "Sofi", "Luna", "Mateo", "Valen", "Nico", "Cami", "Leo", "Mía", "Dani")
        private val PERS = arrayOf("Simpático", "Perezoso", "Ambicioso", "Goloso")
        private val skins = longArrayOf(0xFFF2C9A0, 0xFFD9A066, 0xFF8D5A3C, 0xFF5C3A21)
        private val hairs = longArrayOf(0xFF2B1B10, 0xFF7A4A21, 0xFFE0B040, 0xFFC03030, 0xFF3060C0)
        private val shirts = longArrayOf(0xFF4A90D9, 0xFFD94A6A, 0xFF4AB86A, 0xFF8E5AD9, 0xFFEEEEEE)
        private val EM = arrayOf("🍔", "⚡", "🚿", "🎮", "💬")
        private val COL = longArrayOf(0xFFFF9F43, 0xFFFFD93D, 0xFF4FC3F7, 0xFFFF6FB5, 0xFFB388FF)
        private var created = false
        private var name = 0; private var skin = 0; private var hair = 0; private var shirt = 0; private var pers = 0
        private val needs = floatArrayOf(80f, 80f, 80f, 80f, 80f)
        private var money = 500f
        private var time = 480f
        private var speed = 1
        private var paused = false
        private val furn = ArrayList<F>()
        private var sx = 5f; private var sy = 6f; private var tx = 5f; private var ty = 6f
        private var dir = 0
        private var pending = -1; private var acting = -1; private var remain = 0f
        private var shopOpen = false; private var placing = -1
        private var msg = ""; private var msgT = 0f
        private val parts = ArrayList<P>()
        private var last = System.nanoTime()
        private var saveT = 0f; private var spawnT = 0f; private var anim = 0f
        private var W = 1f; private var sc = 1f; private var oy = 0f; private var ox = 0f; private var fit = 1f
        private val roomY: Float get() = 0.3f * W
        init { load() }
        fun save() {
        val e = prefs.edit()
        e.putBoolean("c", created).putInt("n", name).putInt("s", skin).putInt("h", hair)
        .putInt("sh", shirt).putInt("p", pers).putFloat("m", money).putFloat("t", time)
        .putString("needs", needs.joinToString(","))
        .putString("f", furn.joinToString(";") { "${it.t},${it.x},${it.y}" })
        e.apply()
        }
        private fun defaults() {
        furn.clear()
        furn.add(F(0, 1, 2)); furn.add(F(1, 4, 2)); furn.add(F(2, 8, 2))
        furn.add(F(3, 1, 7)); furn.add(F(4, 5, 8)); furn.add(F(5, 7, 5))
        }
        private fun load() {
        try {
        created = prefs.getBoolean("c", false)
        name = prefs.getInt("n", 0); skin = prefs.getInt("s", 0); hair = prefs.getInt("h", 0)
        shirt = prefs.getInt("sh", 0); pers = prefs.getInt("p", 0)
        money = prefs.getFloat("m", 500f); time = prefs.getFloat("t", 480f)
        val ns = (prefs.getString("needs", "") ?: "").split(",")
        if (ns.size == 5) for (i in 0..4) needs[i] = ns[i].toFloat()
        val fs = prefs.getString("f", "") ?: ""
        furn.clear()
        if (fs.isNotEmpty()) fs.split(";").forEach { val q = it.split(","); furn.add(F(q[0].toInt(), q[1].toInt(), q[2].toInt())) }
        if (furn.isEmpty()) defaults()
        } catch (ex: Exception) { defaults() }
        }
        private fun r(c: Canvas, x: Float, y: Float, w: Float, h: Float, col: Long) {
        p.color = col.toInt(); c.drawRect(x, y, x + w, y + h, p)
        }
        private fun rr(c: Canvas, l: Float, t: Float, rt: Float, b: Float, col: Long) {
        p.color = col.toInt(); c.drawRoundRect(RectF(l, t, rt, b), 0.02f * W, 0.02f * W, p)
        }
        private fun t(c: Canvas, s: String, x: Float, y: Float, size: Float, col: Long, al: Paint.Align = Paint.Align.LEFT) {
        tp.textSize = size; tp.color = col.toInt(); tp.textAlign = al; c.drawText(s, x, y, tp)
        }
        private fun lerp(a: Long, b: Long, k: Float): Long {
        val ai = a.toInt(); val bi = b.toInt()
        val rr0 = (Color.red(ai) * (1 - k) + Color.red(bi) * k).toInt()
        val gg = (Color.green(ai) * (1 - k) + Color.green(bi) * k).toInt()
        val bb = (Color.blue(ai) * (1 - k) + Color.blue(bi) * k).toInt()
        return Color.rgb(rr0, gg, bb).toLong()
        }
        override fun onSizeChanged(nw: Int, nh: Int, ow: Int, oh: Int) {
        super.onSizeChanged(nw, nh, ow, oh)
        W = nw.toFloat(); sc = W / 160f
        fit = min(1f, nh / (1.75f * W))
        ox = (W - W * fit) / 2f
        oy = max(0f, (nh - 1.75f * W * fit) / 2f)
        }
        override fun onDraw(c: Canvas) {
        val now = System.nanoTime()
        val dt = min(0.1f, (now - last) / 1e9f); last = now
        c.drawColor(0xFF1E1A2B.toInt())
        c.save(); c.translate(ox, oy); c.scale(fit, fit)
        if (!created) drawCreate(c) else { update(dt); drawGame(c) }
        c.restore()
        postInvalidateOnAnimation()
        }
        private fun say(m: String) { msg = m; msgT = 3f }
        private fun go(i: Int) {
        val f = furn[i]; val d = DEFS[f.t]
        var yy = f.y + d.h; if (yy > 10) yy = f.y - 1
        tx = f.x.toFloat(); ty = yy.toFloat(); pending = i; acting = -1
        }
        private fun update(dt: Float) {
        anim += dt
        if (msgT > 0f) msgT -= dt
        val gm = dt * 2f * (if (paused) 0 else speed)
        time += gm
        val mult = floatArrayOf(1f, 1f, 1f, 1f, 1f)
        when (pers) { 1 -> { mult[1] = 1.6f }; 3 -> { mult[0] = 1.6f }; 0 -> { mult[4] = .6f } }
        val rate = floatArrayOf(.06f, .04f, .05f, .05f, .03f)
        for (i in 0..4) needs[i] -= rate[i] * mult[i] * gm
        if (acting < 0) {        val spd = 4f * dt
        val dx = tx - sx; val dy = ty - sy
        if (abs(dx) > 0.05f) { sx += sign(dx) * min(spd, abs(dx)); dir = if (dx > 0) 3 else 2 }
        else if (abs(dy) > 0.05f) { sy += sign(dy) * min(spd, abs(dy)); dir = if (dy > 0) 0 else 1 }
        else if (pending >= 0) { acting = pending; pending = -1; dir = 0; remain = DEFS[furn[acting].t].dur.toFloat() }
        } else {
        val d = DEFS[furn[acting].t]
        for (i in 0..4) needs[i] += d.fx[i] * gm
        money += d.money * gm * (if (pers == 2) 1.25f else 1f)
        remain -= gm
        spawn(dt)
        if (remain <= 0f || (d.stop >= 0 && needs[d.stop] >= 100f)) acting = -1
        }
        for (i in 0..4) needs[i] = needs[i].coerceIn(0f, 100f)
        if (needs[1] <= 0f && acting < 0 && pending < 0) {
        val b = furn.indexOfFirst { it.t == 0 }
        if (b >= 0) { go(b); say("¡Se desmayó de sueño!") }
        }
        parts.forEach { it.y -= 8f * dt; it.life -= dt }
        parts.removeAll { it.life <= 0f }
        saveT += dt
        if (saveT > 5f) { saveT = 0f; save() }
        }
        private fun spawn(dt: Float) {
        spawnT += dt
        if (spawnT < 0.5f) return
        spawnT = 0f
        val f = furn[acting]; val x = f.x * 16f; val y = f.y * 16f
        when (f.t) {
        0 -> parts.add(P(x + 10f, y + 6f, "Z", 2f))
        2 -> parts.add(P(x + 3f + Random.nextFloat() * 9f, y + 8f, "o", 1.2f))
        5 -> parts.add(P(x + 6f, y + 4f, "$", 1.5f))
        else -> {}
        }
        }
        private fun place(cx: Int, cy: Int) {
        val d = DEFS[placing]
        var ok = cx >= 0 && cx + d.w <= 10 && cy >= 2 && cy + d.h <= 10
        if (ok) for (f in furn) {
        val fd = DEFS[f.t]
        if (cx < f.x + fd.w && cx + d.w > f.x && cy < f.y + fd.h && cy + d.h > f.y) ok = false
        }
        if (ok) { money -= d.price; furn.add(F(placing, cx, cy)); placing = -1; say("¡Colocado!"); save() }
        else say("Ahí no se puede")
        }
        override fun onTouchEvent(e: MotionEvent): Boolean {
        if (e.action != MotionEvent.ACTION_UP) return true
        val x = (e.x - ox) / fit; val y = (e.y - oy) / fit
        if (!created) { createTap(y); return true }
        val by = roomY + 176f * sc + 0.03f * W
        if (y >= by && y <= by + 0.13f * W) {
        when ((x / (W / 3f)).toInt().coerceIn(0, 2)) {
        0 -> speed = if (speed == 1) 3 else if (speed == 3) 8 else 1
        1 -> if (placing >= 0) { placing = -1; say("Cancelado") } else shopOpen = !shopOpen
        else -> paused = !paused
        }
        return true
        }
        if (y >= roomY && y <= roomY + 176f * sc) {
        if (shopOpen) {
        val row = ((y - roomY) / (22f * sc)).toInt() - 1
        if (row in 0..6) {
        if (money >= DEFS[row].price) { placing = row; shopOpen = false; say("Toca la casa para colocar: " + DEFS[row].n) }
        else say("No te alcanza el dinero")
        }
        return true
        }
        val cx = (x / (16f * sc)).toInt(); val cy = ((y - roomY) / (16f * sc)).toInt()
        if (placing >= 0) { place(cx, cy); return true }
        val i = furn.indexOfFirst { cx >= it.x && cx < it.x + DEFS[it.t].w && cy >= it.y && cy < it.y + DEFS[it.t].h }
        acting = -1
        if (i >= 0) go(i)
        else if (cy in 2..10 && cx in 0..9) { pending = -1; tx = cx.toFloat(); ty = cy.toFloat() }
        }
        return true
        }
        private fun rowTop(i: Int) = 0.92f * W + i * 0.135f * W
        private fun createTap(y: Float) {
        for (i in 0..5) if (y >= rowTop(i) && y <= rowTop(i) + 0.115f * W) when (i) {
        0 -> name = (name + 1) % NAMES.size
        1 -> skin = (skin + 1) % skins.size
        2 -> hair = (hair + 1) % hairs.size
        3 -> shirt = (shirt + 1) % shirts.size
        4 -> pers = (pers + 1) % PERS.size
        else -> { created = true; time = 480f; sx = 5f; sy = 6f; tx = 5f; ty = 6f; save() }
        }
        }
        private fun mood(): String {
        val a = needs.average().toFloat()
        return if (a > 70f) "😄" else if (a > 45f) "🙂" else if (a > 25f) "😟" else "😠"
        }
        private fun drawSim(c: Canvas, cx: Float, by0: Float, walking: Boolean) {
        val fr = if (walking) (anim * 8f).toInt() % 2 else 0
        val by = by0 - (if (walking && fr == 1) 1f else 0f)
        val sk = skins[skin]; val hr = hairs[hair]; val sh = shirts[shirt]
        r(c, cx - 4f, by0 - 1f, 8f, 2f, 0x44000000)
        val lh = if (walking && fr == 1) 3f else 4f
        val rh = if (walking && fr == 0) 3f else 4f
        r(c, cx - 3f, by - lh, 2f, lh, 0xFF3A3F5C)
        r(c, cx + 1f, by - rh, 2f, rh, 0xFF3A3F5C)
        r(c, cx - 3f, by - 9f, 6f, 5f, sh)
        r(c, cx - 4f, by - 9f, 1f, 4f, sk); r(c, cx + 3f, by - 9f, 1f, 4f, sk)
        r(c, cx - 3f, by - 15f, 6f, 6f, sk)
        if (dir == 1) r(c, cx - 3f, by - 15f, 6f, 6f, hr)
        else {
        r(c, cx - 3f, by - 15f, 6f, 2f, hr)
        r(c, cx - 3f, by - 15f, 1f, 4f, hr); r(c, cx + 2f, by - 15f, 1f, 4f, hr)
        r(c, cx - 2f, by - 12f, 1f, 1f, 0xFF111111); r(c, cx + 1f, by - 12f, 1f, 1f, 0xFF111111)
        }
        }
        private fun drawF(c: Canvas, f: F) {
        val px = f.x * 16f; val py = f.y * 16f
        val on = acting >= 0 && furn.getOrNull(acting) === f
        when (f.t) {
        0 -> {
        r(c, px + 1f, py + 1f, 14f, 30f, 0xFF8B5A2B); r(c, px + 2f, py + 2f, 12f, 28f, 0xFFF4F4F4)
        r(c, px + 3f, py + 3f, 10f, 6f, 0xFFDDE6F5)
        if (on) { r(c, px + 5f, py + 4f, 6f, 5f, skins[skin]); r(c, px + 5f, py + 4f, 6f, 2f, hairs[hair]) }
        r(c, px + 2f, py + 12f, 12f, 17f, 0xFF5B8DEF); r(c, px + 2f, py + 12f, 12f, 2f, 0xFF8FB0FF)
        }
        1 -> {
        r(c, px + 3f, py, 10f, 16f, 0xFFDDE5EA); r(c, px + 3f, py + 6f, 10f, 1f, 0xFF9AA5AD)
        r(c, px + 11f, py + 2f, 1f, 3f, 0xFF667788); r(c, px + 11f, py + 8f, 1f, 4f, 0xFF667788)
        }
        2 -> {
        r(c, px + 2f, py, 12f, 16f, 0xFFBFE6F5); r(c, px + 6f, py + 1f, 4f, 2f, 0xFF888888)
        r(c, px + 2f, py + 13f, 12f, 3f, 0xFF99CCDD)
        if (on) for (k in 0..2) r(c, px + 6f + k * 2f, py + 4f + ((anim * 10f + k * 3f) % 8f), 1f, 2f, 0xFF4AA8FF)
        }
        3 -> {
        r(c, px + 1f, py + 2f, 30f, 4f, 0xFF8E3F2C); r(c, px + 1f, py + 4f, 30f, 11f, 0xFFB5543C)
        r(c, px + 1f, py + 6f, 3f, 9f, 0xFF8E3F2C); r(c, px + 28f, py + 6f, 3f, 9f, 0xFF8E3F2C)
        r(c, px + 15f, py + 6f, 1f, 8f, 0xFF8E3F2C)
        }
        4 -> {
        r(c, px + 3f, py + 11f, 10f, 4f, 0xFF5A3E2B); r(c, px + 2f, py + 2f, 12f, 9f, 0xFF222222)
        val scr = if (on) (if ((anim * 6f).toInt() % 2 == 0) 0xFF6EC1FF else 0xFFFF8CC6) else 0xFF3A4A5A
        r(c, px + 3f, py + 3f, 10f, 7f, scr)
        }
        5 -> {
        r(c, px + 1f, py + 8f, 14f, 7f, 0xFF9C6B3A); r(c, px + 4f, py + 1f, 8f, 7f, 0xFF222222)
        r(c, px + 5f, py + 2f, 6f, 5f, if (on) 0xFF6EC1FF else 0xFF2E3B4E); r(c, px + 4f, py + 10f, 8f, 2f, 0xFFCCCCCC)
        }
        else -> {
        r(c, px + 5f, py + 10f, 6f, 5f, 0xFFB5653A); r(c, px + 3f, py + 3f, 10f, 8f, 0xFF3FA34D)
        r(c, px + 6f, py + 1f, 4f, 4f, 0xFF4CC15C)
        }
        }
        }
        private fun drawRoom(c: Canvas) {
        val hr = (time / 60f) % 24f
        val dk = if (hr < 5f) 1f else if (hr < 7f) 1f - (hr - 5f) / 2f else if (hr < 19f) 0f else if (hr < 21f) (hr - 19f) / 2f else 1f
        for (yy in 2..10) for (xx in 0..9) r(c, xx * 16f, yy * 16f, 16f, 16f, if ((xx + yy) % 2 == 0) 0xFFC8935A else 0xFFBE8850)
        r(c, 0f, 0f, 160f, 32f, 0xFF7AA6C9); r(c, 0f, 30f, 160f, 2f, 0xFF5B4636)
        r(c, 56f, 5f, 34f, 22f, 0xFFF5F5F5); r(c, 58f, 7f, 30f, 18f, lerp(0xFF8EDBFF, 0xFF0B1030, dk))
        r(c, 72f, 7f, 2f, 18f, 0xFFF5F5F5); r(c, 58f, 15f, 30f, 2f, 0xFFF5F5F5)
        r(c, 103f, 8f, 2f, 6f, 0xFF5B4636); r(c, 100f, 14f, 8f, 5f, 0xFFFFE08A)
        for (f in furn.sortedBy { it.y }) drawF(c, f)
        val sleeping = acting >= 0 && furn[acting].t == 0
        if (!sleeping) drawSim(c, sx * 16f + 8f, sy * 16f + 15f, acting < 0 && (abs(tx - sx) > 0.05f || abs(ty - sy) > 0.05f))
        for (q in parts) {
        val col = if (q.s == "Z") 0xFFFFFFFF else if (q.s == "o") 0xFF8FD8FF else 0xFFFFD866
        t(c, q.s, q.x, q.y, 7f, col, Paint.Align.CENTER)
        }
        if (dk > 0f) {
        r(c, 0f, 0f, 160f, 176f, Color.argb((dk * 125).toInt(), 10, 15, 60).toLong())
        tp.color = Color.argb((dk * 70).toInt(), 255, 224, 138); c.drawCircle(104f, 16f, 28f, tp)
        }
        }
        private fun drawGame(c: Canvas) {
        c.save(); c.translate(0f, roomY); c.scale(sc, sc); drawRoom(c); c.restore()
        r(c, 0f, 0f, W, roomY, 0xFF2A2440)
        t(c, mood() + " " + NAMES[name] + " · " + PERS[pers], 0.03f * W, 0.07f * W, 0.045f * W, 0xFFFFFFFF)
        t(c, "💰 $" + money.toInt(), 0.97f * W, 0.07f * W, 0.045f * W, 0xFFFFD866, Paint.Align.RIGHT)
        val m = time.toInt() % 1440
        t(c, "Día " + ((time / 1440f).toInt() + 1) + " · " + "%02d:%02d".format(m / 60, m % 60), 0.03f * W, 0.13f * W, 0.038f * W, 0xFFB8B0D8)
        if (msgT > 0f) t(c, msg, 0.97f * W, 0.13f * W, 0.032f * W, 0xFFFFFFFF, Paint.Align.RIGHT)
        for (i in 0..4) {
        val x0 = i * W / 5f; val bx = x0 + 0.02f * W; val bw = W / 5f - 0.04f * W
        t(c, EM[i], x0 + W / 10f, 0.215f * W, 0.05f * W, 0xFFFFFFFF, Paint.Align.CENTER)
        r(c, bx, 0.235f * W, bw, 0.03f * W, 0xFF15111F)
        val col = if (needs[i] < 25f && (anim * 3f).toInt() % 2 == 0) 0xFFFF4040 else COL[i]
        r(c, bx, 0.235f * W, bw * needs[i] / 100f, 0.03f * W, col)
        }
        val by = roomY + 176f * sc + 0.03f * W
        val lb = arrayOf("⏩ x" + speed, "🛒 Tienda", if (paused) "▶ Seguir" else "⏸ Pausa")
        for (i in 0..2) {
        rr(c, i * W / 3f + 0.015f * W, by, (i + 1) * W / 3f - 0.015f * W, by + 0.13f * W, 0xFF3B3355)
        t(c, lb[i], i * W / 3f + W / 6f, by + 0.085f * W, 0.045f * W, 0xFFFFFFFF, Paint.Align.CENTER)
        }
        if (shopOpen) {
        r(c, 0f, roomY, W, 176f * sc, 0xF01E1A2B)
        t(c, "Tienda  ·  💰 $" + money.toInt(), W / 2f, roomY + 0.09f * W, 0.055f * W, 0xFFFFD866, Paint.Align.CENTER)
        for (i in 0..6) {
        val ry = roomY + (i + 1) * 22f * sc
        rr(c, 0.03f * W, ry + 0.01f * W, 0.97f * W, ry + 22f * sc - 0.01f * W, if (money >= DEFS[i].price) 0xFF3B3355 else 0xFF2A2638)
        t(c, DEFS[i].n + "  ·  $" + DEFS[i].price, 0.06f * W, ry + 0.085f * W, 0.05f * W, if (money >= DEFS[i].price) 0xFFFFFFFF else 0xFF777777)
        }
        }
        }
        private fun drawCreate(c: Canvas) {
        anim += 0.016f
        t(c, "Crea tu Sim", W / 2f, 0.14f * W, 0.08f * W, 0xFFFFFFFF, Paint.Align.CENTER)
        c.save(); c.translate(W / 2f, 0.7f * W); c.scale(W / 45f, W / 45f)
        dir = 0; drawSim(c, 0f, 0f, false); c.restore()
        val lb = arrayOf("Nombre: " + NAMES[name], "🎨 Cambiar piel", "💇 Cambiar pelo", "👕 Cambiar ropa", "🎭 " + PERS[pers], "▶ ¡Jugar!")
        for (i in 0..5) {
        rr(c, 0.08f * W, rowTop(i), 0.92f * W, rowTop(i) + 0.115f * W, if (i == 5) 0xFF3FA34D else 0xFF3B3355)
        t(c, lb[i], W / 2f, rowTop(i) + 0.077f * W, 0.05f * W, 0xFFFFFFFF, Paint.Align.CENTER)
        }
        }
        }
